<section class="page">
  <header class="page-header">
    <div>
      <h1>Gastos</h1>
      <p>Egresos operativos (renta, servicios, etc.).</p>
    </div>
    <div class="filters">
      <input
        type="search"
        placeholder="Buscar…"
        [(ngModel)]="list.search"
        name="search"
        (keyup.enter)="searchNow()"
      />
      <button type="button" class="btn ghost" (click)="searchNow()">Buscar</button>
      <button type="button" class="btn" (click)="openCreate()">Registrar gasto</button>
    </div>
  </header>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Categoría</th>
          <th>Monto</th>
          <th>Sucursal</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (item of items(); track item.id) {
          <tr>
            <td>{{ item.expense_date | timestamp }}</td>
            <td>{{ item.category }}</td>
            <td>{{ item.amount }}</td>
            <td>{{ item.branch?.name || 'General' }}</td>
            <td class="row-actions">
              <button type="button" class="btn ghost" (click)="edit(item)">Editar</button>
              <button type="button" class="btn danger" (click)="remove(item.id)">Eliminar</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <app-list-pager [meta]="list.meta()" (pageChange)="goToPage($event)" />

  <app-modal
    [open]="formOpen()"
    [title]="editingId ? 'Editar gasto' : 'Registrar gasto'"
    (closed)="closeForm()"
  >
    <form #f="ngForm" id="expense-form" class="form-grid" novalidate (ngSubmit)="save(f)">
      <label>
        Categoría
        <input
          [(ngModel)]="form.category"
          name="category"
          required
          #categoryCtrl="ngModel"
          [class.field-invalid]="showInvalid(f, categoryCtrl) || !!apiErrors['category']"
        />
        <app-field-error
          [control]="categoryCtrl"
          [submitted]="f.submitted"
          [apiError]="apiErrors['category'] || ''"
        />
      </label>
      <label>
        Descripción
        <input
          [(ngModel)]="form.description"
          name="description"
          #descriptionCtrl="ngModel"
          [class.field-invalid]="showInvalid(f, descriptionCtrl) || !!apiErrors['description']"
        />
        <app-field-error
          [control]="descriptionCtrl"
          [submitted]="f.submitted"
          [apiError]="apiErrors['description'] || ''"
        />
      </label>
      <label>
        Monto
        <input
          type="number"
          step="0.01"
          [(ngModel)]="form.amount"
          name="amount"
          required
          #amountCtrl="ngModel"
          [class.field-invalid]="showInvalid(f, amountCtrl) || !!apiErrors['amount']"
        />
        <app-field-error
          [control]="amountCtrl"
          [submitted]="f.submitted"
          [apiError]="apiErrors['amount'] || ''"
        />
      </label>
      <label>
        Fecha
        <input
          type="date"
          [(ngModel)]="form.expense_date"
          name="expense_date"
          required
          #expenseDateCtrl="ngModel"
          [class.field-invalid]="showInvalid(f, expenseDateCtrl) || !!apiErrors['expense_date']"
        />
        <app-field-error
          [control]="expenseDateCtrl"
          [submitted]="f.submitted"
          [apiError]="apiErrors['expense_date'] || ''"
        />
      </label>
      <label>
        Sucursal (opcional)
        <select
          [(ngModel)]="form.branch_id"
          name="branch_id"
          #branchCtrl="ngModel"
          [class.field-invalid]="showInvalid(f, branchCtrl) || !!apiErrors['branch_id']"
        >
          <option [ngValue]="null">General</option>
          @for (b of branches(); track b.id) {
            <option [ngValue]="b.id">{{ b.name }}</option>
          }
        </select>
        <app-field-error
          [control]="branchCtrl"
          [submitted]="f.submitted"
          [apiError]="apiErrors['branch_id'] || ''"
        />
      </label>
      <label class="full">
        Notas
        <textarea
          [(ngModel)]="form.notes"
          name="notes"
          rows="2"
          #notesCtrl="ngModel"
          [class.field-invalid]="showInvalid(f, notesCtrl) || !!apiErrors['notes']"
        ></textarea>
        <app-field-error [control]="notesCtrl" [submitted]="f.submitted" [apiError]="apiErrors['notes'] || ''" />
      </label>
      @if (formError) {
        <p class="error full">{{ formError }}</p>
      }
    </form>
    <div modalFooter class="actions modal-actions">
      <button class="btn ghost" type="button" (click)="closeForm()">Cancelar</button>
      <button class="btn" type="submit" form="expense-form">
        {{ editingId ? 'Guardar cambios' : 'Registrar' }}
      </button>
    </div>
  </app-modal>
</section>
