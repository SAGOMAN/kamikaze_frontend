<div class="login-page">
  <form #f="ngForm" class="login-card" novalidate (ngSubmit)="submit(f)">
    <p class="eyebrow">Hanuman Style</p>
    <h1>Acceso admin</h1>
    <p class="lead">Gestiona sucursales, alumnos, asistencia y finanzas.</p>

    <label>
      Correo
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        autocomplete="username"
        #emailCtrl="ngModel"
        [class.field-invalid]="showInvalid(f, emailCtrl) || !!apiErrors['email']"
      />
      <app-field-error [control]="emailCtrl" [submitted]="f.submitted" [apiError]="apiErrors['email'] || ''" />
    </label>
    <label>
      Contraseña
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        required
        autocomplete="current-password"
        #passwordCtrl="ngModel"
        [class.field-invalid]="showInvalid(f, passwordCtrl) || !!apiErrors['password']"
      />
      <app-field-error
        [control]="passwordCtrl"
        [submitted]="f.submitted"
        [apiError]="apiErrors['password'] || ''"
      />
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      @if (loading()) {
        <span class="spinner btn-spinner" aria-hidden="true"></span>
        Entrando…
      } @else {
        Entrar
      }
    </button>
  </form>
</div>
