<section class="page">
  <header class="page-header">
    <div>
      <h1>Alumnos</h1>
      <p>Inscripción global (acceso a cualquier sucursal). Apodo opcional.</p>
    </div>
    <div class="filters">
      <input placeholder="Buscar…" [(ngModel)]="search" name="search" (keyup.enter)="reload()" />
      <button type="button" class="btn" (click)="reload()">Buscar</button>
    </div>
  </header>

  <form class="panel form-grid" (ngSubmit)="save()">
    <label>
      Nombre
      <input [(ngModel)]="form.first_name" name="first_name" required />
    </label>
    <label>
      Apellidos
      <input [(ngModel)]="form.last_name" name="last_name" required />
    </label>
    <label>
      Apodo
      <input [(ngModel)]="form.nickname" name="nickname" />
    </label>
    <label>
      Teléfono
      <input [(ngModel)]="form.phone" name="phone" />
    </label>
    <label>
      Correo
      <input type="email" [(ngModel)]="form.email" name="email" />
    </label>
    <label class="checkbox">
      <input type="checkbox" [(ngModel)]="form.is_active" name="is_active" />
      Activo
    </label>
    <div class="actions">
      <button class="btn" type="submit">{{ editingId ? 'Actualizar' : 'Inscribir' }}</button>
      @if (editingId) {
        <button class="btn ghost" type="button" (click)="reset()">Cancelar</button>
      }
    </div>
  </form>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Alumno</th>
          <th>Contacto</th>
          <th>Estado</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (item of items(); track item.id) {
          <tr>
            <td>{{ displayName(item) }}</td>
            <td>{{ item.phone || item.email || '—' }}</td>
            <td>{{ item.is_active ? 'Activo' : 'Inactivo' }}</td>
            <td class="row-actions">
              <button type="button" class="btn ghost" (click)="edit(item)">Editar</button>
              <button type="button" class="btn danger" (click)="remove(item.id)">Eliminar</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
