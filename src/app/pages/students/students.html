<section class="page">
  <header class="page-header">
    <div>
      <h1>Alumnos</h1>
      <p>Inscripción global (acceso a cualquier sucursal). Apodo opcional.</p>
    </div>
    <div class="filters">
      <input
        type="search"
        placeholder="Buscar…"
        [(ngModel)]="list.search"
        name="search"
        (keyup.enter)="searchNow()"
      />
      <button type="button" class="btn ghost" (click)="searchNow()">Buscar</button>
      <button type="button" class="btn" (click)="openCreate()">Inscribir alumno</button>
    </div>
  </header>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Alumno</th>
          <th>Contacto</th>
          <th>Estado</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (item of items(); track item.id) {
          <tr>
            <td>{{ displayName(item) }}</td>
            <td>{{ item.phone || item.email || '—' }}</td>
            <td>{{ item.is_active ? 'Activo' : 'Inactivo' }}</td>
            <td class="row-actions">
              <button type="button" class="btn ghost" (click)="edit(item)">Editar</button>
              <button type="button" class="btn danger" (click)="remove(item.id)">Eliminar</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <app-list-pager [meta]="list.meta()" (pageChange)="goToPage($event)" />

  <app-modal
    [open]="formOpen()"
    [title]="editingId ? 'Editar alumno' : 'Inscribir alumno'"
    (closed)="closeForm()"
  >
    <form #f="ngForm" id="student-form" class="form-grid" novalidate (ngSubmit)="save(f)">
      <label>
        Nombre
        <input
          [(ngModel)]="form.first_name"
          name="first_name"
          required
          #firstName="ngModel"
          [class.field-invalid]="showInvalid(f, firstName) || !!apiErrors['first_name']"
        />
        <app-field-error
          [control]="firstName"
          [submitted]="f.submitted"
          [apiError]="apiErrors['first_name'] || ''"
        />
      </label>
      <label>
        Apellidos
        <input
          [(ngModel)]="form.last_name"
          name="last_name"
          required
          #lastName="ngModel"
          [class.field-invalid]="showInvalid(f, lastName) || !!apiErrors['last_name']"
        />
        <app-field-error
          [control]="lastName"
          [submitted]="f.submitted"
          [apiError]="apiErrors['last_name'] || ''"
        />
      </label>
      <label>
        Apodo
        <input
          [(ngModel)]="form.nickname"
          name="nickname"
          #nickname="ngModel"
          [class.field-invalid]="showInvalid(f, nickname) || !!apiErrors['nickname']"
        />
        <app-field-error
          [control]="nickname"
          [submitted]="f.submitted"
          [apiError]="apiErrors['nickname'] || ''"
        />
      </label>
      <label>
        Teléfono
        <input
          [(ngModel)]="form.phone"
          name="phone"
          #phone="ngModel"
          [class.field-invalid]="showInvalid(f, phone) || !!apiErrors['phone']"
        />
        <app-field-error [control]="phone" [submitted]="f.submitted" [apiError]="apiErrors['phone'] || ''" />
      </label>
      <label>
        Correo
        <input
          type="email"
          [(ngModel)]="form.email"
          name="email"
          #email="ngModel"
          [class.field-invalid]="showInvalid(f, email) || !!apiErrors['email']"
        />
        <app-field-error [control]="email" [submitted]="f.submitted" [apiError]="apiErrors['email'] || ''" />
      </label>
      <label class="checkbox">
        <input type="checkbox" [(ngModel)]="form.is_active" name="is_active" />
        Activo
      </label>
      @if (formError) {
        <p class="error full">{{ formError }}</p>
      }
    </form>
    <div modalFooter class="actions modal-actions">
      <button class="btn ghost" type="button" (click)="closeForm()">Cancelar</button>
      <button class="btn" type="submit" form="student-form">
        {{ editingId ? 'Guardar cambios' : 'Inscribir' }}
      </button>
    </div>
  </app-modal>
</section>
