<section class="page">
  <header class="page-header">
    <div>
      <h1>Profesores</h1>
      <p>Instructores que rotan entre sucursales.</p>
    </div>
  </header>

  <form class="panel form-grid" (ngSubmit)="save()">
    <label>
      Nombre
      <input [(ngModel)]="form.name" name="name" required />
    </label>
    <label>
      Teléfono
      <input [(ngModel)]="form.phone" name="phone" />
    </label>
    <label>
      Correo
      <input type="email" [(ngModel)]="form.email" name="email" />
    </label>
    <label class="checkbox">
      <input type="checkbox" [(ngModel)]="form.is_active" name="is_active" />
      Activo
    </label>
    <label class="full">
      Notas
      <textarea [(ngModel)]="form.notes" name="notes" rows="2"></textarea>
    </label>
    <div class="actions">
      <button class="btn" type="submit">{{ editingId ? 'Actualizar' : 'Crear' }}</button>
      @if (editingId) {
        <button class="btn ghost" type="button" (click)="reset()">Cancelar</button>
      }
    </div>
  </form>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Contacto</th>
          <th>Estado</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (item of items(); track item.id) {
          <tr>
            <td>{{ item.name }}</td>
            <td>{{ item.phone || item.email || '—' }}</td>
            <td>{{ item.is_active ? 'Activo' : 'Inactivo' }}</td>
            <td class="row-actions">
              <button type="button" class="btn ghost" (click)="edit(item)">Editar</button>
              <button type="button" class="btn danger" (click)="remove(item.id)">Eliminar</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
