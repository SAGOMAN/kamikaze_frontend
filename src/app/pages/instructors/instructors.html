<section class="page">
  <header class="page-header">
    <div>
      <h1>Profesores</h1>
      <p>Instructores que rotan entre sucursales.</p>
    </div>
    <button type="button" class="btn" (click)="openCreate()">Nuevo profesor</button>
  </header>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Contacto</th>
          <th>Estado</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (item of items(); track item.id) {
          <tr>
            <td>{{ item.name }}</td>
            <td>{{ item.phone || item.email || '—' }}</td>
            <td>{{ item.is_active ? 'Activo' : 'Inactivo' }}</td>
            <td class="row-actions">
              <button type="button" class="btn ghost" (click)="edit(item)">Editar</button>
              <button type="button" class="btn danger" (click)="remove(item.id)">Eliminar</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <app-modal
    [open]="formOpen()"
    [title]="editingId ? 'Editar profesor' : 'Nuevo profesor'"
    (closed)="closeForm()"
  >
    <form class="form-grid" (ngSubmit)="save()">
      <label>
        Nombre
        <input [(ngModel)]="form.name" name="name" required />
      </label>
      <label>
        Teléfono
        <input [(ngModel)]="form.phone" name="phone" />
      </label>
      <label>
        Correo
        <input type="email" [(ngModel)]="form.email" name="email" />
      </label>
      <label class="checkbox">
        <input type="checkbox" [(ngModel)]="form.is_active" name="is_active" />
        Activo
      </label>
      <label class="full">
        Notas
        <textarea [(ngModel)]="form.notes" name="notes" rows="2"></textarea>
      </label>
      <div class="actions modal-actions">
        <button class="btn ghost" type="button" (click)="closeForm()">Cancelar</button>
        <button class="btn" type="submit">{{ editingId ? 'Guardar cambios' : 'Crear' }}</button>
      </div>
    </form>
  </app-modal>
</section>
