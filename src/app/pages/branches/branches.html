<section class="page">
  <header class="page-header">
    <div>
      <h1>Sucursales</h1>
      <p>Administra las sedes de Hanuman Style.</p>
    </div>
    <div class="filters">
      <input
        type="search"
        placeholder="Buscar…"
        [(ngModel)]="list.search"
        name="search"
        (keyup.enter)="searchNow()"
      />
      <button type="button" class="btn ghost" (click)="searchNow()">Buscar</button>
      <button type="button" class="btn" (click)="openCreate()">Nueva sucursal</button>
    </div>
  </header>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Color</th>
          <th>Nombre</th>
          <th>Dirección</th>
          <th>Estado</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (item of items(); track item.id) {
          <tr>
            <td>
              <span class="color-swatch" [style.background]="item.color" [title]="item.color"></span>
              <span class="color-code">{{ item.color }}</span>
            </td>
            <td>{{ item.name }}</td>
            <td>{{ item.address || '—' }}</td>
            <td>{{ item.is_active ? 'Activa' : 'Inactiva' }}</td>
            <td class="row-actions">
              <button type="button" class="btn ghost" (click)="edit(item)">Editar</button>
              <button type="button" class="btn danger" (click)="remove(item.id)">Eliminar</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <app-list-pager [meta]="list.meta()" (pageChange)="goToPage($event)" />

  <app-modal
    [open]="formOpen()"
    [title]="editingId ? 'Editar sucursal' : 'Nueva sucursal'"
    (closed)="closeForm()"
  >
    <form #f="ngForm" id="branch-form" class="form-grid" novalidate (ngSubmit)="save(f)">
      <label>
        Nombre
        <input
          [(ngModel)]="form.name"
          name="name"
          required
          #nameCtrl="ngModel"
          [class.field-invalid]="showInvalid(f, nameCtrl) || !!apiErrors['name']"
        />
        <app-field-error [control]="nameCtrl" [submitted]="f.submitted" [apiError]="apiErrors['name'] || ''" />
      </label>
      <label>
        Dirección
        <input
          [(ngModel)]="form.address"
          name="address"
          #addressCtrl="ngModel"
          [class.field-invalid]="showInvalid(f, addressCtrl) || !!apiErrors['address']"
        />
        <app-field-error
          [control]="addressCtrl"
          [submitted]="f.submitted"
          [apiError]="apiErrors['address'] || ''"
        />
      </label>
      <label>
        Color
        <span class="color-field">
          <input
            type="color"
            [ngModel]="(form.color || '#64748B').toLowerCase()"
            (ngModelChange)="onColorPicker($event)"
            name="color_picker"
          />
          <input
            type="text"
            [(ngModel)]="form.color"
            name="color"
            pattern="^#[0-9A-Fa-f]{6}$"
            maxlength="7"
            required
            placeholder="#64748B"
            #colorCtrl="ngModel"
            [class.field-invalid]="showInvalid(f, colorCtrl) || !!apiErrors['color']"
          />
        </span>
        <app-field-error
          [control]="colorCtrl"
          [submitted]="f.submitted"
          [apiError]="apiErrors['color'] || ''"
          patternMessage="Usa formato #RRGGBB."
        />
      </label>
      <label class="checkbox">
        <input type="checkbox" [(ngModel)]="form.is_active" name="is_active" />
        Activa
      </label>
      @if (formError) {
        <p class="error full">{{ formError }}</p>
      }
    </form>
    <div modalFooter class="actions modal-actions">
      <button class="btn ghost" type="button" (click)="closeForm()">Cancelar</button>
      <button class="btn" type="submit" form="branch-form">
        {{ editingId ? 'Guardar cambios' : 'Crear' }}
      </button>
    </div>
  </app-modal>
</section>
