<section class="page">
  <header class="page-header">
    <div>
      <h1>Sucursales</h1>
      <p>Administra las sedes de Hanuman Style.</p>
    </div>
  </header>

  <form class="panel form-grid" (ngSubmit)="save()">
    <label>
      Nombre
      <input [(ngModel)]="form.name" name="name" required />
    </label>
    <label>
      Dirección
      <input [(ngModel)]="form.address" name="address" />
    </label>
    <label class="checkbox">
      <input type="checkbox" [(ngModel)]="form.is_active" name="is_active" />
      Activa
    </label>
    <div class="actions">
      <button class="btn" type="submit">{{ editingId ? 'Actualizar' : 'Crear' }}</button>
      @if (editingId) {
        <button class="btn ghost" type="button" (click)="reset()">Cancelar</button>
      }
    </div>
  </form>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Dirección</th>
          <th>Estado</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (item of items(); track item.id) {
          <tr>
            <td>{{ item.name }}</td>
            <td>{{ item.address || '—' }}</td>
            <td>{{ item.is_active ? 'Activa' : 'Inactiva' }}</td>
            <td class="row-actions">
              <button type="button" class="btn ghost" (click)="edit(item)">Editar</button>
              <button type="button" class="btn danger" (click)="remove(item.id)">Eliminar</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
