<section class="page">
  <header class="page-header">
    <div>
      <h1>Sucursales</h1>
      <p>Administra las sedes de Hanuman Style.</p>
    </div>
    <button type="button" class="btn" (click)="openCreate()">Nueva sucursal</button>
  </header>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Dirección</th>
          <th>Estado</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (item of items(); track item.id) {
          <tr>
            <td>{{ item.name }}</td>
            <td>{{ item.address || '—' }}</td>
            <td>{{ item.is_active ? 'Activa' : 'Inactiva' }}</td>
            <td class="row-actions">
              <button type="button" class="btn ghost" (click)="edit(item)">Editar</button>
              <button type="button" class="btn danger" (click)="remove(item.id)">Eliminar</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <app-modal
    [open]="formOpen()"
    [title]="editingId ? 'Editar sucursal' : 'Nueva sucursal'"
    (closed)="closeForm()"
  >
    <form class="form-grid" (ngSubmit)="save()">
      <label>
        Nombre
        <input [(ngModel)]="form.name" name="name" required />
      </label>
      <label>
        Dirección
        <input [(ngModel)]="form.address" name="address" />
      </label>
      <label class="checkbox">
        <input type="checkbox" [(ngModel)]="form.is_active" name="is_active" />
        Activa
      </label>
      <div class="actions modal-actions">
        <button class="btn ghost" type="button" (click)="closeForm()">Cancelar</button>
        <button class="btn" type="submit">{{ editingId ? 'Guardar cambios' : 'Crear' }}</button>
      </div>
    </form>
  </app-modal>
</section>
