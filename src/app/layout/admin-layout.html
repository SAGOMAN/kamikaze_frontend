<div class="shell" [class.menu-open]="menuOpen()">
  <header class="topbar">
    <button
      type="button"
      class="menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="admin-sidebar"
      aria-label="Abrir o cerrar menú"
    >
      <span class="menu-toggle-bars" aria-hidden="true"></span>
    </button>
    <div class="topbar-brand">
      <span class="brand-mark">HS</span>
      <div>
        <strong>Hanuman Style</strong>
        <small>Panel admin</small>
      </div>
    </div>
  </header>

  <div
    class="sidebar-backdrop"
    [class.visible]="menuOpen()"
    (click)="closeMenu()"
    aria-hidden="true"
  ></div>

  <aside
    id="admin-sidebar"
    class="sidebar"
    [class.open]="menuOpen()"
    [attr.aria-hidden]="isMobile() && !menuOpen() ? true : null"
    [attr.inert]="isMobile() && !menuOpen() ? '' : null"
  >
    <div class="sidebar-head">
      <div class="brand">
        <span class="brand-mark">HS</span>
        <div>
          <strong>Hanuman Style</strong>
          <small>Panel admin</small>
        </div>
      </div>
      <button
        type="button"
        class="sidebar-close"
        (click)="closeMenu()"
        aria-label="Cerrar menú"
      >
        ×
      </button>
    </div>
    <nav>
      <a routerLink="/app/dashboard" routerLinkActive="active">Resumen</a>
      <a routerLink="/app/branches" routerLinkActive="active">Sucursales</a>
      <a routerLink="/app/students" routerLinkActive="active">Alumnos</a>
      <a routerLink="/app/payments" routerLinkActive="active">Mensualidades</a>
      <a routerLink="/app/attendance" routerLinkActive="active">Asistencia</a>
      <a routerLink="/app/inventory" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">
        Inventario y egresos
      </a>
      <a routerLink="/app/sales" routerLinkActive="active">Ventas</a>
      <a routerLink="/app/catalogs" routerLinkActive="active">Catálogos</a>
      <a routerLink="/app/instructors" routerLinkActive="active">Profesores</a>
      <a routerLink="/app/schedules" routerLinkActive="active">Horarios</a>
      @if (auth.isAdmin()) {
        <a routerLink="/app/users" routerLinkActive="active">Usuarios</a>
      }
    </nav>
    <div class="sidebar-foot">
      <span>{{ auth.user()?.name }}</span>
      <button type="button" class="linkish" (click)="openPassword()">Cambiar contraseña</button>
      <button type="button" class="linkish" (click)="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>

<app-modal [open]="passwordOpen()" title="Cambiar contraseña" (closed)="closePassword()">
  <form
    #pf="ngForm"
    id="own-password-form"
    class="form-grid"
    novalidate
    (ngSubmit)="savePassword(pf)"
  >
    <label class="full">
      Contraseña actual
      <app-password-input
        [(ngModel)]="passwordForm.current_password"
        name="current_password"
        required
        autocomplete="current-password"
        #currentPassCtrl="ngModel"
        [invalid]="showInvalid(pf, currentPassCtrl) || !!passwordApiErrors['current_password']"
      />
      <app-field-error
        [control]="currentPassCtrl"
        [submitted]="pf.submitted"
        [apiError]="passwordApiErrors['current_password'] || ''"
      />
    </label>
    <label class="full">
      Nueva contraseña
      <app-password-input
        [(ngModel)]="passwordForm.password"
        name="password"
        required
        minlength="8"
        autocomplete="new-password"
        #newPassCtrl="ngModel"
        [invalid]="showInvalid(pf, newPassCtrl) || !!passwordApiErrors['password']"
      />
      <app-field-error
        [control]="newPassCtrl"
        [submitted]="pf.submitted"
        [apiError]="passwordApiErrors['password'] || ''"
        minLengthMessage="La contraseña debe tener al menos 8 caracteres."
      />
    </label>
    <label class="full">
      Confirmar contraseña
      <app-password-input
        [(ngModel)]="passwordForm.password_confirmation"
        name="password_confirmation"
        required
        autocomplete="new-password"
        #confirmPassCtrl="ngModel"
        [invalid]="showInvalid(pf, confirmPassCtrl) || !!passwordApiErrors['password']"
      />
      <app-field-error
        [control]="confirmPassCtrl"
        [submitted]="pf.submitted"
        [apiError]="passwordApiErrors['password'] || ''"
      />
    </label>
    @if (passwordError) {
      <p class="error full">{{ passwordError }}</p>
    }
  </form>
  <div modalFooter class="actions modal-actions">
    <button class="btn ghost" type="button" (click)="closePassword()">Cancelar</button>
    <button class="btn" type="submit" form="own-password-form">Actualizar</button>
  </div>
</app-modal>
