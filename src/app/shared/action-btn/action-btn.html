<button
  [type]="type()"
  class="btn action-btn"
  [class.ghost]="variant() === 'ghost'"
  [class.danger]="variant() === 'danger'"
  [disabled]="disabled()"
  [title]="label()"
  [attr.aria-label]="label()"
>
  <svg class="action-btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    @switch (icon()) {
      @case ('create') {
        <path d="M12 5v14M5 12h14" />
      }
      @case ('edit') {
        <path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 16v4Z" />
        <path d="m15 6 3 3" />
      }
      @case ('delete') {
        <path d="M4 7h16M10 11v6M14 11v6M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 .7 12.1A2 2 0 0 0 8.7 21h6.6a2 2 0 0 0 2-1.9L18 7" />
      }
      @case ('view') {
        <path d="M4 7h16M4 12h16M4 17h10" />
      }
      @case ('back') {
        <path d="M15 6 9 12l6 6" />
      }
      @case ('password') {
        <path d="M8 11V8a4 4 0 0 1 8 0v3" />
        <rect x="6" y="11" width="12" height="9" rx="2" />
      }
    }
  </svg>
  <span class="action-btn-label" aria-hidden="true">{{ label() }}</span>
</button>
