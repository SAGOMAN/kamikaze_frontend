<span class="password-field__wrap">
  <input
    class="password-field__input"
    [attr.id]="inputId() || null"
    [type]="visible() ? 'text' : 'password'"
    [value]="value()"
    [disabled]="disabled()"
    [attr.autocomplete]="autocomplete()"
    [attr.placeholder]="placeholder() || null"
    (input)="onInput($event)"
    (blur)="markTouched()"
  />
  <button
    type="button"
    class="password-field__toggle"
    (click)="toggleVisible()"
    [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
    [attr.aria-pressed]="visible()"
    tabindex="-1"
  >
    @if (visible()) {
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          fill="currentColor"
          d="M12 5c-5.2 0-9.5 3.4-11 8 1.5 4.6 5.8 8 11 8s9.5-3.4 11-8c-1.5-4.6-5.8-8-11-8zm0 13a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"
        />
        <path
          fill="currentColor"
          d="M3.3 3.3 20.7 20.7l-1.4 1.4L1.9 4.7 3.3 3.3z"
        />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          fill="currentColor"
          d="M12 5c-5.2 0-9.5 3.4-11 8 1.5 4.6 5.8 8 11 8s9.5-3.4 11-8c-1.5-4.6-5.8-8-11-8zm0 13a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"
        />
      </svg>
    }
  </button>
</span>
